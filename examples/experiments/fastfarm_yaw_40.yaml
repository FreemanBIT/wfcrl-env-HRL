name: fastfarm-yaw-wake-steering

simulator:
  backend: fastfarm
  dt: 3.0

farm:
  turbine_type: nrel_5MW
  xcoords: [0.0, 504.0, 1008.0, 0.0, 504.0, 1008.0]
  ycoords: [-252.0, -252.0, -252.0, 252.0, 252.0, 252.0]

wind:
  speed: 8.0
  direction: 270.0
  turbulence_intensity: 0.06

controller:
  type: fixed_yaw
  yaw_misalignment_deg: [0.0, 0.0, 0.0, -17.0, -17.0, 0.0]

constraints:
  yaw_bounds_deg: [-25.0, 25.0]
  yaw_rate_deg_s: 0.3
  yaw_deadband_deg: 0.5

steps: 40

output:
  root: ../../__simul__/experiments
  plot: true
