name: GCH_2x3_4D
description: NREL 5MW 2x3 at 4D spacing (generated by closedloop.case_config)
floris_version: v4.6

logging:
  console: {enable: true, level: WARNING}
  file: {enable: false, level: WARNING}

solver:
  type: turbine_grid
  turbine_grid_points: 3

farm:
  layout_x:
  - 0.0
  - 504.0
  - 1008.0
  - 0.0
  - 504.0
  - 1008.0
  layout_y:
  - 0.0
  - 0.0
  - 0.0
  - 504.0
  - 504.0
  - 504.0
  turbine_type:
  - nrel_5MW

flow_field:
  air_density: 1.225
  reference_wind_height: -1
  turbulence_intensities:
  - 0.06
  wind_directions:
  - 270.0
  wind_shear: 0.12
  wind_speeds:
  - 8.0
  wind_veer: 0.0

wake:
  enable_active_wake_mixing: false
  enable_secondary_steering: true
  enable_yaw_added_recovery: true
  enable_transverse_velocities: true
  model_strings:
    combination_model: sosfs
    deflection_model: gauss
    turbulence_model: crespo_hernandez
    velocity_model: gauss
  wake_deflection_parameters:
    gauss: {ad: 0.0, alpha: 0.58, bd: 0.0, beta: 0.077, ka: 0.38, kb: 0.004}
  wake_velocity_parameters:
    gauss: {alpha: 0.58, beta: 0.077, ka: 0.38, kb: 0.004}
  wake_turbulence_parameters:
    crespo_hernandez: {initial: 0.1, constant: 0.5, ai: 0.8, downstream: -0.32}
