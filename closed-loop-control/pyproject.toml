[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "closedloop-wfc"
version = "0.1.0"
description = "Data-driven closed-loop wind-farm control (A/B/C) for the WFCRL / FAST.Farm project — NREL 5MW, 2x3 @ 4D"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
floris = ["floris>=4.0"]
ml = ["scikit-learn>=1.3"]
test = ["pytest>=7.0"]

[project.scripts]
cl-demo = "closedloop.demos.run_demo:main"
cl-compare = "closedloop.demos.compare_report:main"

[tool.setuptools.packages.find]
include = ["closedloop*"]

[tool.setuptools.package-data]
closedloop = ["*.md"]
