# induction_mapping.yaml — 诱导因子映射标定（Phase 6 V1 冻结）
#
# induction_ref (a) -> ROSCO references 的确定性映射。
# V1：动量理论 + 标定；后续可替换 Ct 闭环 / PI / 机型表。

defaults:
  a0: 0.3333333333     # 基线轴向诱导（最大功率点近似）
  a_min: 0.05
  a_max: 0.3333333333  # 与 src/induction_supervisor.c 默认 a_max=1/3 统一（决策 2026-10-20）
  ct_coef: 1.0         # Ct 标定系数
  min_pitch_gain_rad: 0.55   # region2 主要执行项标定：1rad ≈ -5%~-7% 功率
  min_pitch_max_rad: 0.30
  power_cap: 1.0

# 输出（ICD v1.5 冻结，见 fcr_rosco_api.h / FcrBridgeOutput）：
#   ct_ref            = ct_coef * 4a(1-a)                              -> S0904
#   r_pitch           = [a(1-a)^2]/[a0(1-a0)^2]  (clamped [0.05, power_cap]) -> S0803
#   r_speed           = r_pitch^(1/3)                                  -> S0804
#   r_torque          = r_pitch^(2/3)                                  -> S0805
#   min_pitch_ref_rad = clamp(min_pitch_gain*(1-r_pitch), 0, min_pitch_max)  -> S0806
#
# ⚠ 本 YAML **当前未被加载**：运行时以 src/induction_supervisor.c 的 C 默认值
#   （a_max=1/3）为准，也可经 env FCR_BRIDGE_IND_A_MAX/MIN 显式覆盖（W-10）。
#   本文件 a_max 已统一为 1/3（与 C 默认一致），避免将来启用加载时的静默偏差。
#   键名 min_pitch_gain_rad/min_pitch_max_rad 对应结构字段
#   FcrInductionMapConfig.min_pitch_gain / .min_pitch_max。

# 每机覆盖（可选）： turbines: { 1: {a0: 0.3}, ... }
# 机型： nrel_5mw （单机型 V1）