# wind_conditions.yaml — 风工质统一配置（开发计划 §4.1 / 方案 V2 §4-§8）
# 约束 4：风速集 {6, 8, 10, 12}；约束 1：风向仅 {0,10,20}（风向在 experiment.yaml/grid.yaml）
# 约束 3：不依赖任何旧盒；全部盒按 (U, TI, seed) 唯一键生成到 FarmInputs/coarse/
wind_speeds_ms: [6.0, 8.0, 10.0, 12.0]
turbulence_intensities: [0.05, 0.10, 0.15]
seeds: [1, 2, 3, 4, 5, 6]          # seed_id -> rand_seed_1 见 config/seed_manifest.csv

turbsim:
  turbulence_model: IECKAI
  iec_wind_type: NTM
  hub_height_ref_m: 90.0
  artificial_hub_height_m: 175.0   # 仅 TurbSim 网格定位；绝不改 turbine 轮毂高度(90m)
  grid_width_m: 1500.0             # 统一盒宽，覆盖 8D/20° 最不利几何（~±345 m + 转子/走廊/蜿蜒余量）
  grid_height_m: 340.0
  grid_bottom_m: 5.0
  target_grid_spacing_m: 9.0       # coarse 验收 8 <= dy,dz <= 10
  num_grid_z: 40
  analysis_time_s: 1600.0          # 下限；实际按 doe 参数随 U 自适应（见 generate_wind_boxes.analysis_time_for）
  usable_time: "ALL"
  time_step_s: 0.10                # TurbSim 内部=输出步长 0.1s（旧盒实证 .bts=10Hz；0.05 徒增一倍生成时长）
  vertical_flow_angle_deg: 0.0
  horizontal_flow_angle_deg: 0.0
  shear_power_law_exponent: 0.0    # 主实验；0.2 剪切敏感性后续再加
  coherence:
    scmod_1: IEC
    scmod_2: IEC
    scmod_3: IEC
    incdec_1: "12.0 0.00035273"
    incdec_2: "12.0 0.00035273"
    incdec_3: "12.0 0.00035273"
    coh_exp: 0.0

# DOE 时长：风盒时间轴须覆盖 1200s 仿真 + 尾流平流（8D 最严 ~29D）。
doe:
  simulation_time_s: 1200.0   # t_settle(600) + n_control_steps(200) * dt(3.0)
  settling_time_s: 600.0
  n_control_steps: 200
  margin_s: 120.0
  max_spacing_D: 8.0

# 12 m/s（Region III，额定风速 11.4 m/s 之上）：
#   机组进入额定功率平台（桨距控制）+ Ct 下降 -> 尾流减弱、可控收益变小；
#   分析按 Region II/III 分层，12m/s 的 derating LUT 可能退回 ratio=1。
