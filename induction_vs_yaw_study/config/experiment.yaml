# experiment.yaml — DOE 组合与批跑参数（开发计划 §5）
# 约束 1：风向仅 {0,10,20}（负风向与正风向对称，效果一致，不测）
wind_direction_offsets_deg: [0.0, 10.0, 20.0]
spacings_D: [2.0, 4.0, 6.0, 8.0]

controls: [baseline, yaw, induction]

floris:
  dt: 60.0
  max_iter: 3

fastfarm:
  control_dt_s: 3.0    # 控制/统计步长 (s)（审查 P0-5：计数派生）
  t_sim_s: 1200.0      # 总仿真时长 (s)
  t_settle_s: 600.0    # 显式结算窗口起点（0-600 行波+机组过渡）

batch:
  # Pilot 吞吐配置（2026-10-20 实测调优，见 STATUS §6.5 吞吐模型）
  #   OMP=1（逐位确定）单 worker ~30min/case；OMP=3（0.018% 噪声）~11min/case
  #   RAM 15.8GB，单 worker ~2.5GB；约束：浏览器可操作 → 可用 ~13GB
  workers: 3                       # 并行 FAST.Farm 实例数（推荐 OMP=3×3=9 线程/20 核）
  omp_threads: 3                   # FAST.Farm OMP 线程数（1=逐位确定；3=快 2.2×，噪声 0.018%）
  max_retries: 2
  cmd_port_base: 5556
  state_port_base: 5557
  wind_time_series_default: null   # null -> 全部走 (U,TI,seed) 解析盒
