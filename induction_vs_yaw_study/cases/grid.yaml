# 工况网格定义 (V2 重构) — induction_vs_yaw_study
# 约束 1：wind_direction_offsets_deg 仅 {0,10,20}（与负风向对称，不做负数）
# 约束 4：wind_speeds_ms 增加 12.0
# 约束 3：入流 .bts 按 (U, TI, seed) 唯一键（config/seed_manifest.csv），
#        命名 inflow_U{U:02d}_TI{TI:02d}_seed{seed:02d}.bts，位于 study/FarmInputs/coarse/。
# 说明：iter_cases 不展开 seed（FLORIS LUT 与 seed 无关，见开发计划 §5.2）；
#        FAST.Farm 全 DOE 用 iter_seeded_cases / build_case_manifest 展开 seed。

# ---- 主扫描维度 ----
wind_speeds_ms: [6.0, 8.0, 10.0, 12.0]
wind_direction_offsets_deg: [0.0, 10.0, 20.0]
turbulence_intensities: [0.05, 0.10, 0.15]
spacings_D: [2.0, 4.0, 6.0, 8.0]
seeds: [1, 2, 3, 4, 5, 6]

# ---- 仿真时长/步长 ----
floris:
  dt: 60.0          # FLORIS 稳态步长 (s)
  max_iter: 3       # 稳态：少数步即可（每步相同设定）

fastfarm:
  control_dt_s: 3.0   # 控制/统计步长 (s)（审查 P0-5：计数派生，不存 n_control_steps）
  t_sim_s: 1200.0     # 总仿真时长 (s)
  t_settle_s: 600.0   # 显式结算窗口起点（尾流传播 + 机组/控制器过渡）

# ---- 冒烟子集：先跑通再扩展（含 seed 维度）----
smoke_subset:
  wind_speeds_ms: [8.0]
  wind_direction_offsets_deg: [0.0]
  turbulence_intensities: [0.10]
  spacings_D: [4.0]
  seeds: [1]

# ---- 降额优化搜索范围（每台机功率设定点，归一到额定/贪婪的比例）----
derating_search:
  ratio_min: 0.4        # 最低降到贪婪的 40%
  ratio_grid_step: 0.05 # 网格扫描步长（粗扫），细化用优化器

# ---- 偏航优化搜索范围 ----
yaw_search:
  yaw_min_deg: -30.0
  yaw_max_deg: 30.0
  fix_last_turbine_zero: true   # 末机偏航无收益，固定 0 降维
